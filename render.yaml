# Render blueprint for the single production web app.
#
# Production ranking/search is server-first over the versioned full catalog.
# The browser receives only the result batches it needs; the full static
# catalog remains the offline/failure fallback. Supabase owns auth, sync,
# sharing/RLS, and authenticated account deletion.
#
# Render needs only public Supabase client configuration. No service-role or
# Supabase secret key belongs on this web service.
#
# IMPORTANT RELEASE NOTE:
# The current service is still on Render's free plan. Free services can sleep,
# so the first request after inactivity can still be delayed. The starter pack
# makes the swipe screen useful once the page is delivered, but it cannot make
# a sleeping web service answer instantly. Move the existing service to an
# always-on paid plan before a public launch that requires predictable first-hit
# latency. Do not let a blueprint sync change billing without an explicit
# owner decision.
services:
  - type: web
    name: dhawq
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
