# Render blueprint for the single production web app.
#
# Ranking is browser/worker-side today; Supabase owns auth, sync, public sharing
# data, RLS and the authenticated delete-account Edge Function. Render therefore
# needs only the public Supabase client configuration. No service-role/secret
# key belongs on this service.
#
# The free plan can spin down during inactivity. The starter pack keeps the
# swipe screen useful while static catalog assets load, but server-rendered
# public/profile routes still inherit Render cold starts. Move this service to
# an always-on plan before a public launch that requires consistent first-hit
# latency.
services:
  - type: web
    name: dhawq
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/movie-swipe-app-0bvkc8
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
