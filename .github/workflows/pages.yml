name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [claude/movie-swipe-app-0bvkc8, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Strip server-only routes (demo is fully client-side)
        run: rm -rf src/app/api src/app/l src/app/u
      - name: Build static export
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: /Movie
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
